cache:
  schema_cache_ttl_seconds: 3600
  tts_cache_max_size_mb: 500
  tts_cache_ttl_hours: 24
duckdb:
  connection_timeout_seconds: 30
  max_connections: 10
  snapshot_path: data_sources/snapshots/latest.duckdb
google_sheets:
  cache_check_interval_seconds: 60
  credentials_path: credentials/service_account.json
  date_conversion_threshold: 0.5
  demo_mode:
    enabled: true
    # Google Drive folder - all CSV/Excel files will be auto-loaded on startup
    drive_folder_url: "https://drive.google.com/drive/folders/1iJDe85wVldOIDsS6nzmo8OsuESuI3rGA"
    # Legacy spreadsheet IDs (not used when drive_folder_url is set)
    auto_load_spreadsheets: []
  numeric_conversion_threshold: 0.8
  spreadsheet_id: ""
llm:
  api_key_env: GEMINI_API_KEY
  enable_streaming: true
  explainer_max_tokens: 600
  max_retries: 2
  model: gemini-2.5-flash
  model_complex: gemini-2.5-flash
  planner_max_tokens: 1500
  provider: gemini
  request_timeout_seconds: 20
  temperature: 0.7
project:
  environment: development  # Single source of truth (was duplicated in .env)
  name: thara_ai
query:
  default_limit: 100
  max_healing_limit: 1000
  max_healing_retries: 3
  max_result_rows: 10000
  profile_sample_rows: 10000
schema_intelligence:
  embedding_model: text-embedding-3-large
  max_tables_in_prompt: 5
  top_k: 5
table_routing:
  correct_granularity: 30
  data_quality_high: 10
  date_range_covers_query: 20
  has_date_dimension: 15
  has_location_dimension: 15
  has_metric: 20
  has_product_dimension: 15
  is_transactional: 15
voice:
  tts_provider: elevenlabs
  elevenlabs_api_key_env: ELEVENLABS_API_KEY
  default_voice_id: pNInz6obpgDQGcFmaJgB
  tamil_voice_id: pNInz6obpgDQGcFmaJgB
  request_timeout_seconds: 30
  # murf_ai (DISABLED):
  # murf_api_key_env: MURF_API_KEY
  # default_voice_id: en-US-marcus
  # tamil_voice_id: ta-IN-aditi
routing:
  # Confidence thresholds
  confidence_threshold_high: 0.6
  confidence_threshold_low: 0.15
  # Scoring parameters
  score_divisor_single: 60
  strong_score_threshold: 60
  strong_gap_ratio: 0.20
  very_high_score: 80
  max_score_divisor: 100
  magnitude_divisor: 70
  # Gap confidence multipliers
  gap_confidence_small: 0.2
  gap_confidence_medium: 0.4
  gap_confidence_large: 1.5
  # Matching parameters
  cross_table_boost: 0.25
  top_alternatives_count: 5
  min_table_ref_length: 3
  min_word_overlap_ratio: 0.5
  # RAG parameters
  rag_top_k: 3
  rag_score_threshold: 0.5
  # Conversational fallback thresholds
  # If best_score < this AND confidence < confidence_threshold_low AND no data intent → LLM fallback
  # Base scores from table_type(+10) + granularity(+5) + quality(0-10) = ~15-25 for non-data queries
  # Real data queries score 60+ from synonym/column matches, so 25 cleanly separates them
  conversational_fallback_score: 25
  llm_router_timeout: 10
healing:
  fuzzy_match_threshold: 0.90
  table_overlap_ratio: 0.5
formatting:
  currency_symbol: "₹"
  crore_divisor: 10000000
  lakh_divisor: 100000
  thousand_divisor: 1000
  min_word_threshold: 10
